name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Optimised remote images from earlier builds: if Supabase Storage or
      # GitHub is down, the build reuses these instead of losing the images.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.run_id }}
          restore-keys: astro-assets-

      - name: Type check
        run: npm run check

      - name: Build
        env:
          PUBLIC_SUPABASE_URL: https://egqcfennzkzywarpxmwi.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_z2rNXUryA3THtizNMA2p6w_H18Sgo9O
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: full Steam library for "off hours" (repo secret).
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: npm run build

      - name: Performance budget
        run: npm run budget
