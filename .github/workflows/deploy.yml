name: Deploy

# The site is static HTML baked from the database, so it rebuilds whenever
# content can have changed:
#   - code pushed to main
#   - "Publish site" in /admin (repository_dispatch: content-update)
#   - every 6 hours as a safety net (also keeps the Supabase project awake)
#   - manually from the Actions tab
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-update]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A burst of publishes collapses into one build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Publishable key: safe client-side by design (RLS protects the
          # data). Never put the service-role key here.
          PUBLIC_SUPABASE_URL: https://egqcfennzkzywarpxmwi.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_z2rNXUryA3THtizNMA2p6w_H18Sgo9O
          # Live stars / last push for projects, without rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Performance budget
        run: npm run budget

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
