name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # These are publishable/anon keys: safe to expose client-side by
          # design (RLS protects the data, not key secrecy). Never put the
          # sb_secret_ service key here.
          VITE_SUPABASE_URL: "https://egqcfennzkzywarpxmwi.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_z2rNXUryA3THtizNMA2p6w_H18Sgo9O"
        # /portfolio/ base so assets resolve under sambuaneesh.github.io/portfolio/
        run: npm run build -- --base=/portfolio/

      - name: SPA fallback (serve index.html for unknown routes)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
